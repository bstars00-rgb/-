const F=n=>Number(Math.round(n)).toLocaleString('en-US');
const M=n=>{const a=Math.abs(n);return '¥'+(a>=1e9?(n/1e9).toFixed(1)+'B':Math.round(n/1e6).toLocaleString('en-US')+'M');};
const pc=p=>p==null?'—':Math.round(p*100)+'%';

function bars(m25,m26,completeM){   // 누적 추세선 (1/1 0부터 누적, 2025 vs 2026)
  const W=560,H=150,m={t:16,r:10,b:20,l:44},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const c25=[],c26=[]; let a=0,b=0;
  for(let i=0;i<12;i++){a+=m25[i]||0;c25.push(a);}
  for(let i=0;i<completeM;i++){b+=m26[i]||0;c26.push(b);}
  const max=Math.max(c25[11]||0, c26.length?c26[c26.length-1]:0, 1)*1.08;
  const x=mo=>m.l+mo/12*iw, y=v=>m.t+ih-(v/max)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'">';
  for(let i=0;i<=3;i++){const gy=m.t+ih*(i/3);s+='<line x1="'+m.l+'" y1="'+gy+'" x2="'+(W-m.r)+'" y2="'+gy+'" stroke="#243149" stroke-dasharray="2 3"/>';
    s+='<text class="tx" x="'+(m.l-6)+'" y="'+(gy+3)+'" text-anchor="end">'+Math.round(max*(1-i/3)/1e6)+'M</text>';}
  for(let i=0;i<12;i++) s+='<text class="tx" x="'+x(i+1)+'" y="'+(H-7)+'" text-anchor="middle">'+(i+1)+'</text>';
  const p25=[x(0)+','+y(0)].concat(c25.map((v,i)=>x(i+1)+','+y(v))).join(' ');
  const p26=[x(0)+','+y(0)].concat(c26.map((v,i)=>x(i+1)+','+y(v))).join(' ');
  s+='<line x1="'+x(completeM)+'" y1="'+m.t+'" x2="'+x(completeM)+'" y2="'+(m.t+ih)+'" stroke="#f0851f" stroke-dasharray="3 3" opacity="0.45"/>';
  s+='<polyline points="'+p25+'" fill="none" stroke="#546178" stroke-width="2"/>';
  s+='<polyline points="'+p26+'" fill="none" stroke="#3b82f6" stroke-width="2.5"/>';
  if(completeM>0) s+='<circle cx="'+x(completeM)+'" cy="'+y(c26[c26.length-1])+'" r="3.5" fill="#3b82f6"/>';
  s+='</svg>';return s;
}
