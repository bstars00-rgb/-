   +(c.proj2026!=null?' · 2026 예상 <b>'+M(c.proj2026)+'</b> (2025 '+M(c.full2025)+')':'')+'</div>'
   +bars(c.m2025,c.m2026,D.completeMonth)
   +'<div class="lg"><span><i style="background:#546178"></i>2025</span><span><i style="background:#3b82f6"></i>2026</span><span><i style="background:#f0851f;opacity:0.6"></i>2026 진행중(미완료월)</span></div>'
   +'<div class="an"><div class="t">🤖 AI 분석</div>'+c.analysis.map(p=>'<p>'+p+'</p>').join('')+'</div>'
   +'</div>';
}

 +'예상치 = 2026 YTD × (2025 연간 / 2025 동기간). AI 분석은 규칙기반 자동 생성. '
 +'한계: 2025년 예약이나 체크아웃이 데이터 커버(≤2026-07) 밖인 초장기 예약 일부 누락 → 최근월일수록 소폭 보수적. CONFIDENTIAL · 사내 전용.</div>';
