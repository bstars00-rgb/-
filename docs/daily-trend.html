function spark(vals,w,h,color){
  const max=Math.max(...vals,1),n=vals.length,xr=n>1?w/(n-1):0;
  let p='';vals.forEach((v,i)=>{p+=(i?'L':'M')+(i*xr).toFixed(1)+' '+(h-(v/max)*(h-3)).toFixed(1)+' ';});
  const last=vals[vals.length-1];
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+p+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/><circle cx="'+((n-1)*xr).toFixed(1)+'" cy="'+(h-(last/max)*(h-3)).toFixed(1)+'" r="2.6" fill="'+color+'"/></svg>';
}

function kpi(lb,v,sub,delta){
  return '<div class="kpi"><div class="lb">'+lb+'</div><div class="v">'+v+'</div><div class="d '+gc(delta)+'">'+(delta>0?'▲':delta<0?'▼':'—')+' '+gs(delta)+' <span style="color:#8ba0bd;font-weight:600">· '+sub+'</span></div></div>';
}

H+='</div>';

 +'<div class="sub" style="margin:0 0 12px">평균 <b style="color:#cbd5e1">'+d.leadTime.avg+'일</b> · 중앙값 '+d.leadTime.median+'일 · 평균 숙박 '+d.los.avg+'박 (n='+d.leadTime.n+')</div>';
d.leadTime.buckets.forEach(b=>{

  H+='<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:0.88rem"><span>'+b.label+'</span><span style="font-weight:700">'+F(b.count)+'건 · '+b.pct+'%</span></div>'
    +'<div class="bar"><i style="width:'+Math.max(b.pct,1.5)+'%;background:'+c+'"></i></div></div>';
});
H+='</div></div>';
// 취소 프로파일 + 집중도 타일
H+='<div class="tiles" style="margin-top:16px">'
 +tile('14일 취소율',d.cancel.rate14d+'%',F(d.cancel.count14)+'건 취소','#cbd5e1')
 +tile('취소까지 소요',d.cancel.medianHours+'h','중앙값 · 24h내 '+d.cancel.sameDayPct+'%',d.cancel.medianHours<2?'#f87171':'#cbd5e1')
 +tile('즉시취소 비중',d.cancel.fastPct+'%','예약 후 2h 내 '+F(d.cancel.fastCount)+'건',d.cancel.fastPct>=50?'#f87171':'#cbd5e1')
 +tile('채널 집중도','HHI '+F(d.concentration.hhi),'1위 '+esc(d.concentration.top1)+' '+d.concentration.top1Share+'% · 활성 '+d.concentration.activeChannels+'곳',d.concentration.top1Share>=50?'#fbbf24':'#cbd5e1')
 +'</div></section>';

function tile(lb,v,n,color){
  return '<div class="tile"><div class="lb">'+lb+'</div><div class="v" style="color:'+(color||'#fff')+'">'+v+'</div><div class="n">'+n+'</div></div>';
}

// ══ 6. 국가별 ══
H+='<section><h2>국가별 일일 추이</h2><div class="card scroll"><table><thead><tr><th>목적지</th><th style="text-align:right">기준일</th><th style="text-align:right">전일</th><th style="text-align:right">전일대비</th><th style="text-align:right">14일 합</th><th style="text-align:right">14일 TTV</th><th style="text-align:right">ADR</th><th>추이</th></tr></thead><tbody>'
 +d.byCountry.map(c=>'<tr><td>'+(FLAG[c.country]||'🌏')+' '+esc(KO[c.country]||c.country)+'</td><td style="text-align:right;font-weight:700">'+F(c.today)+'</td><td style="text-align:right;color:#93a6c6">'+F(c.prev)+'</td><td style="text-align:right" class="'+gc(c.dod)+'">'+gs(c.dod)+'</td><td style="text-align:right;color:#93a6c6">'+F(c.total14)+'</td><td style="text-align:right">'+wonS(c.ttv14)+'</td><td style="text-align:right;color:#93a6c6">'+wonS(c.adr)+'</td><td>'+spark(c.spark,110,26,'#60a5fa')+'</td></tr>').join('')

// draw 14-day stacked bars (실현 + 취소)
(function(){
  const el=document.getElementById('ch-days'); const W=el.clientWidth||1150,H2=300,m={t:22,r:14,b:38,l:44};
  const iw=W-m.l-m.r,ih=H2-m.t-m.b; const vals=d.days.map(x=>x.bookings); const max=Math.max(...vals,1)*1.12;
  const bw=iw/d.days.length; const y=v=>m.t+ih-(v/max)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H2+'">';
  for(let i=0;i<=4;i++){const gy=m.t+ih*(i/4),val=Math.round(max*(1-i/4));s+='<line class="gl" x1="'+m.l+'" y1="'+gy+'" x2="'+(W-m.r)+'" y2="'+gy+'"/><text class="tx" x="'+(m.l-7)+'" y="'+(gy+3)+'" text-anchor="end">'+F(val)+'</text>';}
  d.days.forEach((day,i)=>{const x0=m.l+bw*i+bw*0.16,w=bw*0.68,last=i===d.days.length-1;
    const done=day.bookings-day.cancelled;
    if(done>0)s+='<rect x="'+x0+'" y="'+y(day.bookings)+'" width="'+w+'" height="'+(y(day.cancelled)-y(day.bookings))+'" rx="3" fill="'+(last?'#f0851f':'#3b82f6')+'" opacity="'+(last?1:0.85)+'"/>';
    if(day.cancelled>0)s+='<rect x="'+x0+'" y="'+y(day.cancelled)+'" width="'+w+'" height="'+(m.t+ih-y(day.cancelled))+'" rx="3" fill="#64748b" opacity="0.75"/>';
    if(i%2===0||last)s+='<text class="tx" x="'+(m.l+bw*i+bw/2)+'" y="'+(H2-22)+'" text-anchor="middle">'+day.date.slice(5)+'</text>';
    s+='<text class="tx" x="'+(m.l+bw*i+bw/2)+'" y="'+(H2-9)+'" text-anchor="middle" style="fill:#64748b">'+day.dow+'</text>';
    if(day.bookings>0)s+='<text class="tv" x="'+(m.l+bw*i+bw/2)+'" y="'+(y(day.bookings)-6)+'" text-anchor="middle" style="fill:'+(last?'#fbbf24':'#8ba0bd')+'">'+F(day.bookings)+'</text>';
  });
  s+='</svg>';el.innerHTML=s;
})();
</script>
