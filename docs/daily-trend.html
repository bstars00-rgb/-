<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데일리 부킹 트렌드 · OMH</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  *{box-sizing:border-box}
  html{font-size:16.5px}
  body{margin:0;background:radial-gradient(1100px 560px at 100% -8%,rgba(59,130,246,0.07),transparent 60%),radial-gradient(820px 480px at -8% 2%,rgba(139,92,246,0.06),transparent 55%),#0d1524;color:#e8eefb;font-family:'Pretendard Variable','Pretendard',-apple-system,'Segoe UI','Malgun Gothic',system-ui,sans-serif;line-height:1.55;letter-spacing:-0.004em;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:26px 28px 80px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:6px}
  h1{font-size:1.9rem;font-weight:800;margin:0;color:#f4f8ff;letter-spacing:-0.02em}
  .sub{color:#93a6c6;font-size:0.92rem;margin-top:4px}
  .asof{color:#93a6c6;font-size:0.85rem}
  .asof b{color:#60a5fa}
  .grid-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:22px 0 8px}
  .kpi{background:linear-gradient(152deg,#1d2a49,#131d34);border:1px solid #32415f;border-radius:18px;box-shadow:0 12px 36px -18px rgba(0,0,0,0.85);padding:18px 20px}
  .kpi .lb{font-size:0.82rem;color:#8ba0bd;font-weight:700}
  .kpi .v{font-size:2rem;font-weight:800;letter-spacing:-0.025em;margin:6px 0 3px;color:#fff;line-height:1.05}
  .kpi .d{font-size:0.9rem;font-weight:800}
  .pos{color:#34d399}.neg{color:#f87171}.flat{color:#94a3b8}
  section{margin-top:30px}
  h2{font-size:1.38rem;font-weight:800;color:#f4f8ff;margin:0 0 16px;display:flex;align-items:center;gap:10px;letter-spacing:-0.01em}
  h2::before{content:'';width:5px;height:26px;background:linear-gradient(180deg,#3b82f6,#6366f1);border-radius:3px;box-shadow:0 0 14px rgba(59,130,246,0.55)}
  .card{background:#16203a;border:1px solid #2a3752;border-radius:18px;box-shadow:0 10px 34px -18px rgba(0,0,0,0.8);padding:22px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .gl{stroke:#243149;stroke-width:1;stroke-dasharray:2 3}
  .tx{fill:#8ba0bd;font-size:11px}.tv{fill:#dbe6f7;font-size:11px;font-weight:700}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:10px 12px;font-size:0.78rem;color:#93a6c6;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #32415f}
  td{padding:11px 12px;font-size:0.95rem;color:#dbe6f7;border-bottom:1px solid #212e46}
  tbody tr:hover td{background:rgba(59,130,246,0.06)}
  .spark{display:inline-block;vertical-align:middle}
  .foot{margin-top:34px;border-top:1px solid #223047;padding-top:14px;color:#6b7ea0;font-size:0.78rem}
  .badge{display:inline-block;font-size:0.7rem;font-weight:800;padding:3px 9px;border-radius:20px;margin-left:8px}
  .badge.live{background:rgba(52,211,153,0.14);color:#34d399;border:1px solid rgba(52,211,153,0.4)}
  .badge.samp{background:rgba(240,133,31,0.14);color:#fbbf24;border:1px solid rgba(240,133,31,0.4)}
  @media(max-width:820px){.grid-kpi{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const D = {"generated":"2026-08-08T07:00:00Z","asof":"2026-08-07","source":"bd-csv","windowDays":14,"days":[{"date":"2026-07-25","dow":"토","bookings":2055,"cancelled":0,"rn":4307,"ttv":72564182,"adr":16848},{"date":"2026-07-26","dow":"일","bookings":2227,"cancelled":0,"rn":4593,"ttv":78126589,"adr":17010},{"date":"2026-07-27","dow":"월","bookings":2448,"cancelled":0,"rn":5051,"ttv":82088799,"adr":16252},{"date":"2026-07-28","dow":"화","bookings":2342,"cancelled":0,"rn":4793,"ttv":79516224,"adr":16590},{"date":"2026-07-29","dow":"수","bookings":2294,"cancelled":0,"rn":4735,"ttv":81646203,"adr":17243},{"date":"2026-07-30","dow":"목","bookings":2181,"cancelled":0,"rn":4517,"ttv":75114684,"adr":16629},{"date":"2026-07-31","dow":"금","bookings":2355,"cancelled":0,"rn":4862,"ttv":82816335,"adr":17033},{"date":"2026-08-01","dow":"토","bookings":2133,"cancelled":0,"rn":4226,"ttv":66714868,"adr":15787},{"date":"2026-08-02","dow":"일","bookings":2314,"cancelled":0,"rn":4517,"ttv":71298937,"adr":15785},{"date":"2026-08-03","dow":"월","bookings":2373,"cancelled":0,"rn":4600,"ttv":71591240,"adr":15563},{"date":"2026-08-04","dow":"화","bookings":2283,"cancelled":0,"rn":4527,"ttv":75569179,"adr":16693},{"date":"2026-08-05","dow":"수","bookings":2551,"cancelled":0,"rn":5220,"ttv":86621887,"adr":16594},{"date":"2026-08-06","dow":"목","bookings":2596,"cancelled":0,"rn":5326,"ttv":88728768,"adr":16660},{"date":"2026-08-07","dow":"금","bookings":2660,"cancelled":0,"rn":5493,"ttv":91803136,"adr":16713}],"latest":{"date":"2026-08-07","dow":"금","bookings":2660,"cancelled":0,"rn":5493,"ttv":91803136,"adr":16713},"prev":{"date":"2026-08-06","dow":"목","bookings":2596,"cancelled":0,"rn":5326,"ttv":88728768,"adr":16660},"dod":{"bookings":2.5,"rn":3.1,"ttv":3.5,"adr":0.3},"wow":{"date":"2026-07-31","bookings":2355,"dodBookings":13},"cancel":{"rate14d":0,"latest":0},"avgDaily":2344,"peakDay":{"date":"2026-08-07","dow":"금","bookings":2660,"cancelled":0,"rn":5493,"ttv":91803136,"adr":16713},"byCountry":[{"country":"Japan","today":1866,"prev":1712,"dod":9,"total14":21511,"spark":[1346,1505,1543,1503,1507,1404,1540,1414,1602,1537,1474,1558,1712,1866]},{"country":"Korea","today":506,"prev":592,"dod":-14.5,"total14":7194,"spark":[405,429,582,546,492,473,529,436,452,547,514,691,592,506]},{"country":"Vietnam","today":258,"prev":249,"dod":3.6,"total14":3696,"spark":[279,277,295,271,260,259,265,260,237,261,256,269,249,258]},{"country":"Thailand","today":16,"prev":27,"dod":-40.7,"total14":255,"spark":[18,7,17,12,27,32,19,16,16,10,20,18,27,16]},{"country":"Hong Kong","today":6,"prev":13,"dod":-53.8,"total14":107,"spark":[6,7,8,4,5,8,2,5,7,10,16,10,13,6]},{"country":"Others","today":6,"prev":3,"dod":100,"total14":40,"spark":[1,2,1,5,3,5,0,2,0,5,3,4,3,6]},{"country":"Taiwan","today":2,"prev":0,"dod":0,"total14":9,"spark":[0,0,2,1,0,0,0,0,0,3,0,1,0,2]}],"byChannel":[{"channel":"Ctrip Korea","total14":11749,"today":1048,"prev":954,"dod":9.9,"spark":[773,792,842,812,857,818,856,728,745,785,780,959,954,1048]},{"channel":"Agoda","total14":4557,"today":362,"prev":400,"dod":-9.5,"spark":[345,373,398,407,370,268,263,204,241,287,324,315,400,362]},{"channel":"Convergent API","total14":3503,"today":120,"prev":134,"dod":-10.4,"spark":[108,131,155,138,123,121,313,511,620,511,302,216,134,120]},{"channel":"Meituan","total14":2439,"today":207,"prev":250,"dod":-17.2,"spark":[154,165,209,166,186,173,184,120,121,131,157,216,250,207]},{"channel":"PKFARE API","total14":2399,"today":211,"prev":190,"dod":11.1,"spark":[135,161,183,187,178,199,166,102,149,134,188,216,190,211]},{"channel":"Elong","total14":1586,"today":180,"prev":139,"dod":29.5,"spark":[103,144,140,104,109,107,89,80,79,77,94,141,139,180]},{"channel":"Ctrip Vietnam","total14":1366,"today":72,"prev":68,"dod":5.9,"spark":[109,125,146,129,123,121,100,98,81,73,49,72,68,72]},{"channel":"Dida","total14":1263,"today":124,"prev":91,"dod":36.3,"spark":[90,86,90,112,82,95,95,38,64,78,117,101,91,124]},{"channel":"Bingtrip","total14":606,"today":65,"prev":44,"dod":47.7,"spark":[47,40,51,44,62,44,36,39,32,36,32,34,44,65]},{"channel":"Alitrip","total14":583,"today":51,"prev":42,"dod":21.4,"spark":[28,30,31,31,27,39,73,59,74,54,20,24,42,51]},{"channel":"triptopaz","total14":383,"today":24,"prev":29,"dod":-17.2,"spark":[24,32,36,40,28,26,25,21,18,21,26,33,29,24]},{"channel":"Meituan Japan","total14":352,"today":41,"prev":69,"dod":-40.6,"spark":[12,21,13,12,18,15,28,26,10,25,32,30,69,41]}],"countries":["Japan","Korea","Vietnam","Taiwan","Thailand","Hong Kong","Others"]};
const F=n=>Number(Math.round(n)).toLocaleString('en-US');
const yen=n=>'¥'+F(n);
const gs=v=>(v>0?'+':'')+v+'%';
const gc=v=>v>1.5?'pos':(v<-1.5?'neg':'flat');
const KO={Japan:'일본',Korea:'한국',Vietnam:'베트남',Taiwan:'대만',Thailand:'태국','Hong Kong':'홍콩',Others:'기타'};
const FLAG={Japan:'🇯🇵',Korea:'🇰🇷',Vietnam:'🇻🇳',Taiwan:'🇹🇼',Thailand:'🇹🇭','Hong Kong':'🇭🇰',Others:'🌏'};

function spark(vals,w,h,color){
  const max=Math.max(...vals,1),n=vals.length,xr=n>1?w/(n-1):0;
  let p='';vals.forEach((v,i)=>{p+=(i?'L':'M')+(i*xr).toFixed(1)+' '+(h-(v/max)*(h-3)).toFixed(1)+' ';});
  const last=vals[vals.length-1];
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+p+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/><circle cx="'+((n-1)*xr).toFixed(1)+'" cy="'+(h-(last/max)*(h-3)).toFixed(1)+'" r="2.6" fill="'+color+'"/></svg>';
}

const d=D, L=d.latest, P=d.prev;
let H='';
// header
H+='<div class="top"><div><h1>데일리 부킹 트렌드'+(d.source==='ellis-mcp'?'<span class="badge live">● LIVE · ELLIS MCP</span>':'<span class="badge samp">SAMPLE · 파일기반</span>')+'</h1>'
 +'<div class="sub">부킹데이트 기준 · 최근 '+d.windowDays+'일 · 매일 07:00 자동 갱신</div></div>'
 +'<div class="asof">기준일 <b>'+L.date+' ('+L.dow+')</b><br><span style="font-size:0.72rem">생성 '+String(d.generated).slice(0,16).replace('T',' ')+'</span></div></div>';
// KPI row — 어제 vs 전일
H+='<div class="grid-kpi">'
 +kpi('어제 예약('+L.date.slice(5)+')',F(L.bookings),'전일 '+F(P.bookings)+'건',d.dod.bookings)
 +kpi('룸나잇',F(L.rn),'전일 대비',d.dod.rn)
 +kpi('TTV',yen(L.ttv),'전일 대비',d.dod.ttv)
 +kpi('ADR',yen(L.adr),'전일 대비',d.dod.adr)
 +(d.wow?kpi('전주 동요일 대비',gs(d.wow.dodBookings),d.wow.date.slice(5)+' '+F(d.wow.bookings)+'건',d.wow.dodBookings):kpi('14일 평균',F(d.avgDaily),'일 평균',0))
 +'</div>';
H+='<div class="sub" style="margin-top:4px">14일 평균 <b style="color:#cbd5e1">'+F(d.avgDaily)+'</b>건 · 피크 '+d.peakDay.date.slice(5)+' '+F(d.peakDay.bookings)+'건 · 취소율 '+d.cancel.rate14d+'%</div>';

function kpi(lb,v,sub,delta){
  return '<div class="kpi"><div class="lb">'+lb+'</div><div class="v">'+v+'</div><div class="d '+gc(delta)+'">'+(delta>0?'▲':delta<0?'▼':'—')+' '+gs(delta)+' <span style="color:#8ba0bd;font-weight:600">· '+sub+'</span></div></div>';
}

// 14-day trend
H+='<section><h2>일별 예약 추이 (14일)</h2><div class="card"><div id="ch-days"></div></div></section>';
// by country
H+='<section><h2>국가별 일일 추이</h2><div class="card"><table><thead><tr><th>목적지</th><th style="text-align:right">어제</th><th style="text-align:right">전일</th><th style="text-align:right">전일대비</th><th style="text-align:right">14일 합</th><th>추이</th></tr></thead><tbody>'
 +d.byCountry.map(c=>'<tr><td>'+(FLAG[c.country]||'🌏')+' '+(KO[c.country]||c.country)+'</td><td style="text-align:right;font-weight:700">'+F(c.today)+'</td><td style="text-align:right;color:#93a6c6">'+F(c.prev)+'</td><td style="text-align:right" class="'+gc(c.dod)+'">'+gs(c.dod)+'</td><td style="text-align:right;color:#93a6c6">'+F(c.total14)+'</td><td>'+spark(c.spark,120,26,'#60a5fa')+'</td></tr>').join('')
 +'</tbody></table></div></section>';
// by channel
H+='<section><h2>채널(고객사)별 일일 추이 · Top 12</h2><div class="card"><table><thead><tr><th>채널</th><th style="text-align:right">어제</th><th style="text-align:right">전일대비</th><th style="text-align:right">14일 합</th><th>추이</th></tr></thead><tbody>'
 +d.byChannel.map(c=>'<tr><td style="font-weight:600">'+c.channel+'</td><td style="text-align:right;font-weight:700">'+F(c.today)+'</td><td style="text-align:right" class="'+gc(c.dod)+'">'+gs(c.dod)+'</td><td style="text-align:right;color:#93a6c6">'+F(c.total14)+'</td><td>'+spark(c.spark,120,26,'#34d399')+'</td></tr>').join('')
 +'</tbody></table></div></section>';

H+='<div class="foot">데이터 소스: '+(d.source==='ellis-mcp'?'ELLIS MCP (실시간 get_hotel_bookings)':'processed booking-date 파일 (샘플/폴백)')+' · 부킹데이트 기준 · 취소건은 실현 RN/TTV/국가·채널 집계에서 제외 · 매일 07:00 KST 자동 갱신 · CONFIDENTIAL</div>';
document.getElementById('app').innerHTML=H;

// draw 14-day bars
(function(){
  const el=document.getElementById('ch-days'); const W=el.clientWidth||1150,H2=300,m={t:22,r:14,b:38,l:44};
  const iw=W-m.l-m.r,ih=H2-m.t-m.b; const vals=d.days.map(x=>x.bookings); const max=Math.max(...vals)*1.12;
  const bw=iw/d.days.length; const y=v=>m.t+ih-(v/max)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H2+'">';
  for(let i=0;i<=4;i++){const gy=m.t+ih*(i/4),val=Math.round(max*(1-i/4));s+='<line class="gl" x1="'+m.l+'" y1="'+gy+'" x2="'+(W-m.r)+'" y2="'+gy+'"/><text class="tx" x="'+(m.l-7)+'" y="'+(gy+3)+'" text-anchor="end">'+F(val)+'</text>';}
  d.days.forEach((day,i)=>{const x0=m.l+bw*i+bw*0.16,w=bw*0.68,last=i===d.days.length-1;
    s+='<rect x="'+x0+'" y="'+y(day.bookings)+'" width="'+w+'" height="'+(m.t+ih-y(day.bookings))+'" rx="3" fill="'+(last?'#f0851f':'#3b82f6')+'" opacity="'+(last?1:0.82)+'"/>';
    if(i%2===0||last)s+='<text class="tx" x="'+(m.l+bw*i+bw/2)+'" y="'+(H2-22)+'" text-anchor="middle">'+day.date.slice(5)+'</text>';
    s+='<text class="tx" x="'+(m.l+bw*i+bw/2)+'" y="'+(H2-9)+'" text-anchor="middle" style="fill:#64748b">'+day.dow+'</text>';
    if(last)s+='<text class="tv" x="'+(m.l+bw*i+bw/2)+'" y="'+(y(day.bookings)-6)+'" text-anchor="middle" style="fill:#fbbf24">'+F(day.bookings)+'</text>';
  });
  s+='</svg>';el.innerHTML=s;
})();
</script>
</body>
</html>
