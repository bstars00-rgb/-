<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데일리 부킹 트렌드 · OMH</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  *{box-sizing:border-box}
  html{font-size:16.5px}
  body{margin:0;background:radial-gradient(1100px 560px at 100% -8%,rgba(59,130,246,0.07),transparent 60%),radial-gradient(820px 480px at -8% 2%,rgba(139,92,246,0.06),transparent 55%),#0d1524;color:#e8eefb;font-family:'Pretendard Variable','Pretendard',-apple-system,'Segoe UI','Malgun Gothic',system-ui,sans-serif;line-height:1.55;letter-spacing:-0.004em;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:26px 28px 80px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:6px}
  h1{font-size:1.9rem;font-weight:800;margin:0;color:#f4f8ff;letter-spacing:-0.02em}
  .sub{color:#93a6c6;font-size:0.92rem;margin-top:4px}
  .asof{color:#93a6c6;font-size:0.85rem;text-align:right}
  .asof b{color:#60a5fa}
  .grid-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:22px 0 8px}
  .kpi{background:linear-gradient(152deg,#1d2a49,#131d34);border:1px solid #32415f;border-radius:18px;box-shadow:0 12px 36px -18px rgba(0,0,0,0.85);padding:18px 20px}
  .kpi .lb{font-size:0.82rem;color:#8ba0bd;font-weight:700}
  .kpi .v{font-size:1.75rem;font-weight:800;letter-spacing:-0.025em;margin:6px 0 3px;color:#fff;line-height:1.08}
  .kpi .d{font-size:0.88rem;font-weight:800}
  .pos{color:#34d399}.neg{color:#f87171}.flat{color:#94a3b8}
  section{margin-top:30px}
  h2{font-size:1.38rem;font-weight:800;color:#f4f8ff;margin:0 0 16px;display:flex;align-items:center;gap:10px;letter-spacing:-0.01em}
  h2::before{content:'';width:5px;height:26px;background:linear-gradient(180deg,#3b82f6,#6366f1);border-radius:3px;box-shadow:0 0 14px rgba(59,130,246,0.55)}
  h2.red::before{background:linear-gradient(180deg,#f87171,#ef4444);box-shadow:0 0 14px rgba(248,113,113,0.55)}
  h2.vio::before{background:linear-gradient(180deg,#a78bfa,#8b5cf6);box-shadow:0 0 14px rgba(167,139,250,0.55)}
  .card{background:#16203a;border:1px solid #2a3752;border-radius:18px;box-shadow:0 10px 34px -18px rgba(0,0,0,0.8);padding:22px}
  .card+.card{margin-top:14px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .gl{stroke:#243149;stroke-width:1;stroke-dasharray:2 3}
  .tx{fill:#8ba0bd;font-size:11px}.tv{fill:#dbe6f7;font-size:11px;font-weight:700}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:10px 12px;font-size:0.78rem;color:#93a6c6;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #32415f;white-space:nowrap}
  td{padding:11px 12px;font-size:0.95rem;color:#dbe6f7;border-bottom:1px solid #212e46}
  tbody tr:hover td{background:rgba(59,130,246,0.06)}
  .scroll{overflow-x:auto}
  .spark{display:inline-block;vertical-align:middle}
  .foot{margin-top:34px;border-top:1px solid #223047;padding-top:14px;color:#6b7ea0;font-size:0.78rem;line-height:1.7}
  .badge{display:inline-block;font-size:0.7rem;font-weight:800;padding:3px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .badge.live{background:rgba(52,211,153,0.14);color:#34d399;border:1px solid rgba(52,211,153,0.4)}
  .badge.samp{background:rgba(240,133,31,0.14);color:#fbbf24;border:1px solid rgba(240,133,31,0.4)}
  /* ── 언어 선택 ── */
  .langs{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
  .lang{font:inherit;cursor:pointer;padding:4px 9px;border-radius:8px;font-size:0.74rem;font-weight:700;
    background:transparent;border:1px solid #2a3752;color:#8ba0bd;transition:border-color .12s,color .12s}
  .lang:hover{border-color:#3f5478;color:#dbe6f7}
  .lang.on{background:rgba(59,130,246,0.16);border-color:#60a5fa;color:#bfdbfe}
  .lang:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .natwarn{border-radius:12px;padding:12px 15px;font-size:0.86rem;line-height:1.5;color:#fcd34d;
    background:rgba(245,158,11,0.10);border:1px solid rgba(251,191,36,0.35)}
  .natwarn b{color:#fde68a}
  /* ── 메인 탭 ── */
  .mtabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 4px;border-bottom:1px solid #243149;padding-bottom:0}
  .mtab{font:inherit;cursor:pointer;padding:10px 18px;border:none;background:none;color:#8ba0bd;
    font-size:0.98rem;font-weight:800;border-bottom:3px solid transparent;margin-bottom:-1px;
    transition:color .12s,border-color .12s;white-space:nowrap}
  .mtab:hover{color:#dbe6f7}
  .mtab.on{color:#bfdbfe;border-bottom-color:#60a5fa}
  .mtab:focus-visible{outline:2px solid #60a5fa;outline-offset:-2px;border-radius:6px}
  .mpanel>section:first-child{margin-top:22px}
  @media(max-width:720px){.mtab{padding:9px 12px;font-size:0.9rem}}
  /* ── 30초 요약 히어로 · 접기 ── */
  @media(min-width:721px){.mtabs{position:sticky;top:0;z-index:20;background:#0d1524;padding-top:6px}}
  .hero{margin-top:22px;border-radius:22px;border:1px solid #3a4d78;background:linear-gradient(135deg,#1b2d57,#14203c 60%);padding:26px 30px;box-shadow:0 18px 50px -24px rgba(0,0,0,0.9)}
  .hero-k{font-size:0.95rem;font-weight:800;color:#93c5fd;letter-spacing:.02em}
  .hero-main{display:flex;gap:34px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .hero-big{font-size:3.6rem;font-weight:900;color:#fff;letter-spacing:-0.035em;line-height:1}
  .hero-big small{font-size:1.15rem;font-weight:800;color:#b9c8e2;margin-left:8px;letter-spacing:0}
  .hero-sub{margin-top:8px;font-size:1.02rem;color:#dbe6f7;font-weight:600}
  .hero-chips{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto}
  .hchip{min-width:150px;padding:13px 17px;border-radius:15px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09)}
  .hchip .lb{font-size:0.8rem;color:#93a6c6;font-weight:700}
  .hchip .v{font-size:1.5rem;font-weight:900;color:#fff;margin-top:3px;letter-spacing:-0.02em}
  .hchip .d{font-size:0.82rem;font-weight:800;margin-top:2px}
  .hero-act{margin-top:20px;padding:15px 18px;border-radius:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:1.02rem;font-weight:700}
  .hero-act.bad{background:rgba(239,68,68,0.13);border:1px solid rgba(248,113,113,0.45);color:#fecaca}
  .hero-act.ok{background:rgba(52,211,153,0.11);border:1px solid rgba(52,211,153,0.4);color:#a7f3d0}
  .hero-act button{margin-left:auto;font:inherit;font-weight:800;font-size:0.9rem;cursor:pointer;padding:8px 16px;border-radius:10px;border:1px solid #60a5fa;background:rgba(59,130,246,0.2);color:#dbeafe}
  .hero-act button:hover{background:rgba(59,130,246,0.35)}
  details.fold{border:1px solid #2a3752;border-radius:16px;background:#131c33}
  details.fold>summary{cursor:pointer;list-style:none;padding:15px 20px;font-weight:800;color:#b9c8e2;font-size:1rem;display:flex;align-items:center;gap:10px}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::after{content:'펼치기 ▾';margin-left:auto;font-size:0.82rem;color:#60a5fa}
  details.fold[open]>summary::after{content:'접기 ▴'}
  details.fold>.fbody{padding:0 20px 20px}
  @media(max-width:720px){.hero{padding:20px 18px}.hero-big{font-size:2.8rem}.hero-chips{margin-left:0;width:100%}.hchip{flex:1;min-width:0;padding:11px 12px}.hchip .v{font-size:1.15rem}.hero-sub{font-size:0.95rem}}
  /* ── 시간대별 국가 추이 (범례 + 차트) ── */
  .hb{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:start}
  .lg{display:flex;flex-direction:column;gap:9px;padding-top:6px}
  .lgi{display:flex;align-items:center;gap:8px;font-size:0.88rem}
  .lgi .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .lgi .ln{color:#b9c8e2}
  .lgi b{margin-left:auto;color:#f4f8ff;font-weight:800}
  .hbc{min-width:0}
  @media(max-width:880px){.hb{grid-template-columns:1fr}.lg{flex-direction:row;flex-wrap:wrap;gap:12px}.lgi b{margin-left:4px}}
  /* ── 국가 탭 (도시/호텔 랭킹) ── */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab{font:inherit;cursor:pointer;padding:7px 13px;border-radius:11px;font-size:0.86rem;font-weight:700;
    background:#16203a;border:1px solid #2a3752;color:#93a6c6;transition:border-color .12s,color .12s,background .12s}
  .tab:hover{border-color:#3f5478;color:#dbe6f7}
  .tab.on{background:rgba(59,130,246,0.14);border-color:#60a5fa;color:#bfdbfe}
  .tab:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  /* ── 반드시 처리할 3가지 ── */
  .must{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .mcard{border-radius:16px;border:1px solid #2a3752;background:#16203a;padding:16px 18px 14px;display:flex;flex-direction:column;gap:9px}
  .mcard.p1{border-color:rgba(248,113,113,0.45);background:linear-gradient(180deg,rgba(239,68,68,0.10),#16203a 55%)}
  .mcard.p2{border-color:rgba(251,191,36,0.38);background:linear-gradient(180deg,rgba(245,158,11,0.08),#16203a 55%)}
  .mcard.p3{border-color:rgba(96,165,250,0.3)}
  .m-top{display:flex;align-items:center;gap:8px}
  .m-rank{width:22px;height:22px;border-radius:7px;background:#2b3a58;color:#cbd5e1;font-size:0.76rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
  .m-title{font-size:1rem;font-weight:800;color:#f4f8ff;line-height:1.3;margin:0}
  .m-num{display:flex;align-items:baseline;gap:5px}
  .m-num b{font-size:1.6rem;font-weight:900;color:#fff;letter-spacing:-0.02em;line-height:1}
  .m-num span{font-size:0.8rem;color:#93a6c6;font-weight:700}
  .m-why{color:#a7b8d4;font-size:0.85rem;line-height:1.45}
  .m-act{margin-top:auto;padding:10px 12px;border-radius:11px;background:rgba(59,130,246,0.09);border-left:3px solid #60a5fa;font-size:0.84rem;color:#dbe6f7;line-height:1.45}
  .m-own{font-size:0.76rem;color:#8ba0bd;font-weight:700}
  @media(max-width:880px){.must{grid-template-columns:1fr}}
  /* ── 알럿 ── */
  .sevbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .sevchip{display:flex;align-items:baseline;gap:8px;padding:10px 16px;border-radius:14px;font-weight:800;font-size:0.88rem;border:1px solid}
  .sevchip b{font-size:1.5rem;letter-spacing:-0.02em}
  .s-p1{background:rgba(239,68,68,0.13);border-color:rgba(248,113,113,0.45);color:#fca5a5}
  .s-p2{background:rgba(245,158,11,0.12);border-color:rgba(251,191,36,0.42);color:#fcd34d}
  .s-p3{background:rgba(96,165,250,0.10);border-color:rgba(96,165,250,0.35);color:#93c5fd}
  .s-ok{background:rgba(52,211,153,0.12);border-color:rgba(52,211,153,0.42);color:#6ee7b7}
  .al{border-radius:16px;border:1px solid #2a3752;background:#16203a;padding:0;margin-bottom:12px;overflow:hidden}
  .al.p1{border-color:rgba(248,113,113,0.45);background:linear-gradient(180deg,rgba(239,68,68,0.09),#16203a 42%)}
  .al.p2{border-color:rgba(251,191,36,0.38);background:linear-gradient(180deg,rgba(245,158,11,0.07),#16203a 42%)}
  .al.p3{border-color:rgba(96,165,250,0.3)}
  .alh{display:flex;align-items:center;gap:12px;padding:16px 20px 12px;flex-wrap:wrap}
  .tag{font-size:0.72rem;font-weight:900;padding:4px 10px;border-radius:8px;letter-spacing:.06em}
  .tag.p1{background:#ef4444;color:#fff}.tag.p2{background:#f59e0b;color:#231a05}.tag.p3{background:#3b82f6;color:#fff}
  .alt{font-size:1.06rem;font-weight:800;color:#f4f8ff}
  .cnt{margin-left:auto;font-size:1.35rem;font-weight:900;color:#fff}
  .cnt span{font-size:0.8rem;color:#93a6c6;font-weight:700}
  .ald{padding:0 20px 12px;color:#b9c8e2;font-size:0.92rem}
  .act{margin:0 20px 14px;padding:12px 15px;border-radius:12px;background:rgba(59,130,246,0.09);border-left:3px solid #60a5fa;font-size:0.9rem;color:#dbe6f7}
  .act b{color:#93c5fd}
  .own{float:right;font-size:0.78rem;color:#8ba0bd;font-weight:700}
  /* ── 알럿 카드 그리드 ── */
  .alcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:13px}
  .alcard{position:relative;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;
    border-radius:16px;border:1px solid #2a3752;background:#16203a;padding:15px 17px 13px;
    display:flex;flex-direction:column;gap:9px;transition:transform .13s ease,border-color .13s ease,box-shadow .13s ease}
  .alcard:hover,.alcard:focus-visible{transform:translateY(-2px);border-color:#3f5478;box-shadow:0 8px 22px rgba(0,0,0,0.34);outline:none}
  .alcard:focus-visible{border-color:#60a5fa}
  .alcard.p1{border-color:rgba(248,113,113,0.45);background:linear-gradient(180deg,rgba(239,68,68,0.10),#16203a 55%)}
  .alcard.p2{border-color:rgba(251,191,36,0.38);background:linear-gradient(180deg,rgba(245,158,11,0.08),#16203a 55%)}
  .alcard.p3{border-color:rgba(96,165,250,0.3)}
  .alcard.p1:hover,.alcard.p1:focus-visible{border-color:#f87171}
  .alcard.p2:hover,.alcard.p2:focus-visible{border-color:#fbbf24}
  .alcard.p3:hover,.alcard.p3:focus-visible{border-color:#60a5fa}
  .ac-top{display:flex;align-items:center;gap:8px}
  .ac-title{font-size:0.99rem;font-weight:800;color:#f4f8ff;line-height:1.32;margin:0}
  .ac-num{display:flex;align-items:baseline;gap:5px;margin-top:1px}
  .ac-num b{font-size:1.72rem;font-weight:900;color:#fff;letter-spacing:-0.02em;line-height:1}
  .ac-num span{font-size:0.82rem;color:#93a6c6;font-weight:700}
  .ac-desc{color:#a7b8d4;font-size:0.85rem;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ac-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:9px;border-top:1px solid rgba(255,255,255,0.06)}
  .ac-own{font-size:0.76rem;color:#8ba0bd;font-weight:700}
  .ac-open{margin-left:auto;font-size:0.79rem;font-weight:800;color:#93c5fd;white-space:nowrap}
  .alcard:hover .ac-open{color:#bfdbfe}
  /* ── 상세 모달 ── */
  .ovl{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:22px;
    background:rgba(7,11,22,0.74);backdrop-filter:blur(3px)}
  .ovl.on{display:flex}
  .mdl{width:min(1020px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:18px;
    border:1px solid #2a3752;background:#131c33;box-shadow:0 24px 64px rgba(0,0,0,0.55);overflow:hidden}
  .mdl.p1{border-color:rgba(248,113,113,0.5)}.mdl.p2{border-color:rgba(251,191,36,0.44)}.mdl.p3{border-color:rgba(96,165,250,0.4)}
  .mdh{display:flex;align-items:center;gap:11px;padding:17px 20px 13px;flex-wrap:wrap;border-bottom:1px solid #2a3752}
  .mdh .alt{font-size:1.08rem}
  .mdx{margin-left:auto;background:#243149;border:1px solid #35455f;color:#cbd5e1;border-radius:9px;
    width:32px;height:32px;font-size:1.05rem;line-height:1;cursor:pointer;flex:none}
  .mdx:hover{background:#2f3f59;color:#fff}
  .mdb{overflow:auto;padding:0 0 4px}
  .mdb .ald{padding:14px 20px 11px}
  .mdb table{margin:0}
  .mdb th{position:sticky;top:0;z-index:1;background:#1a2440;border-bottom:1px solid #2a3752}
  .mdb td{font-size:0.87rem;padding:9px 12px}
  .mdf{padding:9px 20px;color:#7f93b3;font-size:0.82rem;border-top:1px solid #2a3752;background:#111a2e}
  .al table{margin:0}
  .al th{background:rgba(0,0,0,0.18);border-bottom:1px solid #2a3752}
  .al td{font-size:0.87rem;padding:9px 12px}
  .mono{font-family:'SF Mono',Consolas,monospace;font-size:0.82rem;color:#93c5fd}
  .st{font-size:0.75rem;font-weight:800;padding:2px 8px;border-radius:6px;background:#243149;color:#cbd5e1}
  .st.warn{background:rgba(245,158,11,0.18);color:#fcd34d}
  .st.bad{background:rgba(239,68,68,0.18);color:#fca5a5}
  .st.ok{background:rgba(52,211,153,0.16);color:#6ee7b7}
  /* ── 인사이트 ── */
  .ins{background:linear-gradient(150deg,#1e1b3a,#141d33);border:1px solid #3b3566}
  .ins li{margin:0 0 11px;padding-left:26px;position:relative;color:#dbe6f7;font-size:0.96rem;list-style:none}
  .ins li:last-child{margin-bottom:0}
  .ins li::before{position:absolute;left:0;top:0;font-size:0.95rem}
  .ins li.good::before{content:'✅'}.ins li.warn::before{content:'⚠️'}
  .ins li.bad::before{content:'🔴'}.ins li.flat::before{content:'📊'}
  .ins ul{margin:0;padding:0}
  /* ── 통계 타일 ── */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .tile{background:#16203a;border:1px solid #2a3752;border-radius:14px;padding:15px 17px}
  .tile .lb{font-size:0.78rem;color:#8ba0bd;font-weight:700}
  .tile .v{font-size:1.45rem;font-weight:800;color:#fff;margin:5px 0 2px;letter-spacing:-0.02em}
  .tile .n{font-size:0.78rem;color:#7f93b3}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bar{height:10px;border-radius:6px;background:#243149;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:6px}
  .dq{font-size:0.82rem;color:#93a6c6;background:rgba(96,165,250,0.07);border:1px solid #2a3752;border-radius:12px;padding:10px 15px;margin-top:14px}
  @media(max-width:960px){.grid-kpi{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
  @media(max-width:640px){
    .ovl{padding:10px}
    .mdl{max-height:93vh}
    .mdh{padding:14px 56px 11px 15px;position:relative}
    .mdx{position:absolute;right:14px;top:12px;margin:0}
    .mdh .cnt{margin-left:0}
    .mdb .ald{padding:12px 15px 10px}
    .mdb .act{margin:0 15px 12px}
    .own{float:none;display:block;margin:8px 0 0}
    .mdb table{min-width:640px}
    .mdb td,.mdb th{white-space:nowrap}
    .mdf{padding:9px 15px}
  }
</style>
</head>
<body>

  var d=(I18N[LANG]&&I18N[LANG][k])!=null?I18N[LANG][k]:(I18N.ko[k]!=null?I18N.ko[k]:k);
  if(v) for(var n in v) d=d.split('{'+n+'}').join(v[n]);

}

// 10만 미만은 그대로 쓴다. 엔화는 원화보다 자릿수가 한 자리 작아 1만에서 '만'으로 접으면
// ADR(≈1.5만엔) 같은 값이 "2만"으로 반올림돼 정밀도가 사라진다.
// ko/ja는 억(億)·만(万), en/vi는 M/B
const wonS=n=>{const a=Math.abs(n),h=T('amtHundredM'),k=T('amtTenK');
  if(h){return a>=1e8?CUR+(n/1e8).toFixed(1)+h:a>=1e5?CUR+F(Math.round(n/1e4))+k:CUR+F(Math.round(n));}
  return a>=1e9?CUR+(n/1e9).toFixed(2)+'B':a>=1e6?CUR+(n/1e6).toFixed(1)+'M':CUR+F(Math.round(n));};
// 알럿 문구(code별 번역, vars 치환). 사전에 없으면 데이터의 한국어 그대로
function AV(a){var v=Object.assign({},a.vars||{}); if(v.amt!=null) v.amt=won(v.amt); return v;}
function AL(a,f){var k='al_'+a.code+'_'+f; return HAS(k)?T(k,AV(a)):a[{t:'title',d:'detail',a:'action',o:'owner'}[f]];}
function AU(a){return T(a.unitKey||'unitCase');}
// 인사이트 문장(key+vars로 재조립). key 없으면 데이터 text
function INS(i){
  var v=Object.assign({},i.vars||{}); if(!i.key||!HAS(i.key)) return i.text;
  var s;
  switch(i.key){
    case 'insP1': v.list=D.alerts.filter(function(a){return a.sev==='P1';}).map(function(a){return AL(a,'t').split(' (')[0]+' '+F(a.count)+AU(a);}).join(', '); v.n=F(v.n); return T('insP1',v);
    case 'insYest': v.dir=T('dir_'+v.dir); v.cmp=T('cmp_'+v.cmp); ['net','total','cxl','avg'].forEach(function(x){v[x]=F(v[x]);}); return T('insYest',v);
    case 'insMargin': s=T('insMargin',{days:v.days,ttv:wonS(v.ttv),margin:wonS(v.margin),pct:v.pct}); return s+(v.low?T('insMarginLow'):'');
    case 'insLead': return T('insLead',v)+(v.high?T('insLeadHigh'):'');
    case 'insCxl': s=T('insCxl',{days:v.days,rate:v.rate,c:F(v.c),med:v.med}); return s+(v.fast?T('insCxlFast',v):T('insCxlSame',v));
    case 'insPend': return T('insPend',{n:F(v.n),list:(v.list||[]).map(function(x){return x.ch+' '+F(x.n)+UC();}).join(', ')});
    case 'insZero': if(v.date) v.date=v.date+' ('+DOW(v.date)+')'; return T(i.key,v);
    case 'insToday': if(v.date) v.date=v.date+' ('+DOW(D.latest.date)+')'; return T(i.key,v);
    default: return T(i.key,v);
  }
}

function spark(vals,w,h,color){
  const max=Math.max(...vals,1),n=vals.length,xr=n>1?w/(n-1):0;
  let p='';vals.forEach((v,i)=>{p+=(i?'L':'M')+(i*xr).toFixed(1)+' '+(h-(v/max)*(h-3)).toFixed(1)+' ';});
  const last=vals[vals.length-1];
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+p+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/><circle cx="'+((n-1)*xr).toFixed(1)+'" cy="'+(h-(last/max)*(h-3)).toFixed(1)+'" r="2.6" fill="'+color+'"/></svg>';
}

// ══ 8. 국가별 Top 20 도시 / 호텔 ══
function rankSection(id,title,data,nameHead){
  const keys=Object.keys(data||{}); if(!keys.length) return '';
  let h='<section><h2>'+title+'</h2>'
   +'<div class="sub" style="margin:-8px 0 12px">'+T('rankSub',{n:d.windowDays})+'</div>'
   +'<div class="tabs">'+keys.map((k,i)=>'<button class="tab'+(i?'':' on')+'" data-g="'+id+'" data-k="'+esc(k)+'">'+(FLAG[k]||'🌏')+' '+esc(CN(k))+'</button>').join('')+'</div>';
  keys.forEach((k,i)=>{
    h+='<div class="card scroll tabp" data-g="'+id+'" data-k="'+esc(k)+'"'+(i?' hidden':'')+'><table><thead><tr>'
     +'<th style="text-align:right">#</th><th>'+nameHead+'</th>'
     +'<th style="text-align:right">'+T('thYesterday')+'</th><th style="text-align:right">'+T('daysWin',{n:d.windowDays})+'</th>'
     +'<th style="text-align:right">TTV</th><th style="text-align:right">'+T('thShare')+'</th>'
     +(d.hasMargin?'<th style="text-align:right">Profit</th><th style="text-align:right">'+T('thMarginPct')+'</th>':'')
     +'<th style="text-align:right">ADR</th></tr></thead><tbody>'
     +data[k].map(r=>'<tr><td style="text-align:right;color:#6b7ea0">'+r.rank+'</td>'
       +'<td style="font-weight:600">'+esc(r.name)+'</td>'
       +'<td style="text-align:right;font-weight:700">'+F(r.bkToday)+'</td>'
       +'<td style="text-align:right;color:#93a6c6">'+F(r.bk)+'</td>'
       +'<td style="text-align:right">'+wonS(r.ttv)+'</td>'
       +'<td style="text-align:right;color:#93c5fd;font-weight:700">'+r.share+'%</td>'
       +(d.hasMargin?'<td style="text-align:right">'+wonS(r.margin)+'</td>'
         +'<td style="text-align:right;color:'+(r.marginPct>0&&r.marginPct<5?'#fca5a5':'#cbd5e1')+';font-weight:700">'+r.marginPct+'%</td>':'')
       +'<td style="text-align:right;color:#93a6c6">'+wonS(r.adr)+'</td></tr>').join('')
     +'</tbody></table></div>';
  });
  return h+'</section>';
}

H+='<div class="foot">'+T('foot1',{src:(d.source==='ellis-mcp'?'ELLIS MCP (get_hotel_bookings)':T('srcFallback'))})+'<br>'
 +T('foot2',{n:d.windowDays})+' · '+T('confidential')+'</div>';
// ── 탭 조립 ──
// H에 심어둔 <!--@@key@@--> 마커로 잘라 탭별 패널로 재조립한다.
// 마커 앞부분(헤더 등)은 항상 보이는 고정 영역.
var TABDEF=[['overview',T('tabOverview')],['action',T('tabAction')],['trend',T('tabTrend')],['quality',T('tabQuality')],['mix',T('tabMix')],['rank',T('tabRank')]];
(function(){
  var parts=H.split(/<!--@@([a-z]+)@@-->/);
  var head=parts[0], bucket={};
  for(var i=1;i<parts.length;i+=2){ var k=parts[i]; bucket[k]=(bucket[k]||'')+(parts[i+1]||''); }
  var avail=TABDEF.filter(function(t){return (bucket[t[0]]||'').trim().length;});
  var bar='<div class="mtabs">'+avail.map(function(t,i){
    return '<button type="button" class="mtab'+(i?'':' on')+'" data-t="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>';
  var panels=avail.map(function(t,i){
    return '<div class="mpanel" data-t="'+t[0]+'"'+(i?' hidden':'')+'>'+bucket[t[0]]+'</div>';}).join('');
  document.getElementById('app').innerHTML=head+bar+panels;
  var saved=null; try{saved=localStorage.getItem('dt-tab');}catch(e){}
  function show(k){
    var any=false;
    document.querySelectorAll('.mtab').forEach(function(b){var on=b.dataset.t===k;b.classList.toggle('on',on);if(on)any=true;});
    if(!any) return false;
    document.querySelectorAll('.mpanel').forEach(function(x){x.hidden=(x.dataset.t!==k);});
    try{localStorage.setItem('dt-tab',k);}catch(e){}
    return true;
  }
  document.querySelectorAll('.mtab').forEach(function(b){
    b.addEventListener('click',function(){ show(b.dataset.t); window.scrollTo({top:0,behavior:'smooth'}); });
  });
  // 언어 전환 — 렌더가 최상위 1회 흐름이라 재렌더 대신 저장 후 리로드가 안전하다(자체완결 페이지라 즉시 뜬다).
  document.querySelectorAll('.lang').forEach(function(b){
    b.addEventListener('click',function(){ try{localStorage.setItem('dt-lang',b.dataset.l);}catch(e){} location.reload(); });
  });
  document.querySelectorAll('[data-goto]').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.goto);window.scrollTo({top:0,behavior:'smooth'});});});
  if(saved) show(saved);
})();

// 국가 탭 전환 (도시/호텔 랭킹). 그룹(data-g)별로 독립 동작.
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    var g=b.dataset.g,k=b.dataset.k;
    document.querySelectorAll('.tab[data-g="'+g+'"]').forEach(function(x){x.classList.toggle('on',x===b);});
    document.querySelectorAll('.tabp[data-g="'+g+'"]').forEach(function(x){x.hidden=(x.dataset.k!==k);});
  });
});

// ══ 알럿 상세 모달 ══
(function(){
  const ovl=document.createElement('div');
  ovl.className='ovl'; ovl.id='ovl';
  ovl.innerHTML='<div class="mdl" role="dialog" aria-modal="true" aria-labelledby="mdl-t"></div>';
  document.body.appendChild(ovl);
  const box=ovl.firstChild;
  let opener=null;

  function open(i){
    const a=d.alerts[i]; if(!a)return;
    const p=a.sev.toLowerCase(), n=(a.items||[]).length;
    box.className='mdl '+p;
    box.innerHTML='<div class="mdh"><span class="tag '+p+'">'+a.sev+'</span>'
      +'<span class="alt" id="mdl-t">'+esc(AL(a,'t'))+'</span>'
      +'<span class="cnt" style="margin-left:14px">'+F(a.count)+'<span> '+esc(AU(a))+'</span></span>'
      +'<button type="button" class="mdx" id="mdl-x" aria-label="'+T('mdClose')+'">✕</button></div>'
      +'<div class="mdb"><div class="ald">'+esc(AL(a,'d'))+'</div>'
      +'<div class="act" style="margin:0 20px 14px"><span class="own">'+T('owner')+' · '+esc(AL(a,'o'))+'</span><b>'+T('action')+'</b> — '+esc(AL(a,'a'))+'</div>'
      +alertTable(a)+'</div>'
      +(a.count>n?'<div class="mdf">'+T('mdMore',{n:F(n),m:F(a.count-n)})+'</div>':'');
    ovl.classList.add('on');
    document.body.style.overflow='hidden';
    box.querySelector('#mdl-x').addEventListener('click',close);
    box.querySelector('#mdl-x').focus();
  }
  function close(){
    ovl.classList.remove('on');
    document.body.style.overflow='';
    if(opener){opener.focus();opener=null;}
  }
  document.querySelectorAll('.alcard').forEach(btn=>{
    btn.addEventListener('click',()=>{opener=btn;open(+btn.dataset.al);});
  });
  ovl.addEventListener('click',e=>{if(e.target===ovl)close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ovl.classList.contains('on'))close();});
})();

// draw 14-day stacked bars (실현 + 취소)
(function(){
  const el=document.getElementById('ch-days'); const W=el.clientWidth||1150,H2=300,m={t:22,r:14,b:38,l:44};
  const iw=W-m.l-m.r,ih=H2-m.t-m.b; const vals=d.days.map(x=>x.bookings); const max=Math.max(...vals,1)*1.12;
  const bw=iw/d.days.length; const y=v=>m.t+ih-(v/max)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H2+'">';
  for(let i=0;i<=4;i++){const gy=m.t+ih*(i/4),val=Math.round(max*(1-i/4));s+='<line class="gl" x1="'+m.l+'" y1="'+gy+'" x2="'+(W-m.r)+'" y2="'+gy+'"/><text class="tx" x="'+(m.l-7)+'" y="'+(gy+3)+'" text-anchor="end">'+F(val)+'</text>';}
  d.days.forEach((day,i)=>{const x0=m.l+bw*i+bw*0.16,w=bw*0.68,last=i===d.days.length-1;
    const done=day.bookings-day.cancelled;
    if(done>0)s+='<rect x="'+x0+'" y="'+y(day.bookings)+'" width="'+w+'" height="'+(y(day.cancelled)-y(day.bookings))+'" rx="3" fill="'+(last?'#f0851f':'#3b82f6')+'" opacity="'+(last?1:0.85)+'"/>';
    if(day.cancelled>0)s+='<rect x="'+x0+'" y="'+y(day.cancelled)+'" width="'+w+'" height="'+(m.t+ih-y(day.cancelled))+'" rx="3" fill="#64748b" opacity="0.75"/>';
    if(d.days.length<=8||i%2===0||last)s+='<text class="tx" x="'+(m.l+bw*i+bw/2)+'" y="'+(H2-22)+'" text-anchor="middle">'+day.date.slice(5)+'</text>';
    s+='<text class="tx" x="'+(m.l+bw*i+bw/2)+'" y="'+(H2-9)+'" text-anchor="middle" style="fill:#64748b">'+DOW(day.date)+'</text>';
    if(day.bookings>0)s+='<text class="tv" x="'+(m.l+bw*i+bw/2)+'" y="'+(y(day.bookings)-6)+'" text-anchor="middle" style="fill:'+(last?'#fbbf24':'#8ba0bd')+'">'+F(day.bookings)+'</text>';
  });
  s+='</svg>';el.innerHTML=s;
})();
</script>
