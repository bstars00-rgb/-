function spark(vals,w,h,color){
  const max=Math.max(...vals,1),n=vals.length,xr=n>1?w/(n-1):0;
  let p='';vals.forEach((v,i)=>{p+=(i?'L':'M')+(i*xr).toFixed(1)+' '+(h-(v/max)*(h-3)).toFixed(1)+' ';});
  const last=vals[vals.length-1];
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+p+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/><circle cx="'+((n-1)*xr).toFixed(1)+'" cy="'+(h-(last/max)*(h-3)).toFixed(1)+'" r="2.6" fill="'+color+'"/></svg>';
}

(function(){
  var M=d.hourlyMoney; if(!M) return;
  var W=1060,Hh=340,pl=64,pr=64,pt=16,pb=30;
  var maxL=0,maxR=0;
  M.selling.forEach(function(v){if(v>maxL)maxL=v;});
  M.margin.forEach(function(v){if(v>maxR)maxR=v;});
  var nice=function(v){if(v<=0)return 1;var e=Math.pow(10,Math.floor(Math.log(v)/Math.LN10));var n=Math.ceil(v/e*4)/4;return n*e;};
  var topL=nice(maxL),topR=nice(maxR);
  var X=function(i){return pl+i*(W-pl-pr)/23;};
  var YL=function(v){return Hh-pb-(v/topL)*(Hh-pt-pb);};
  var YR=function(v){return Hh-pb-(v/topR)*(Hh-pt-pb);};
  var g='';
  for(var t=0;t<=4;t++){
    var yy=YL(topL/4*t);
    g+='<line class="gl" x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'"></line>'
      +'<text class="tx" x="'+(pl-8)+'" y="'+(yy+4)+'" text-anchor="end">'+wonS(Math.round(topL/4*t))+'</text>'
      +'<text class="tx" x="'+(W-pr+8)+'" y="'+(yy+4)+'" text-anchor="start" style="fill:#fb923c">'+wonS(Math.round(topR/4*t))+'</text>';
  }
  for(var i=0;i<24;i++){ if(i%2) continue;
    g+='<text class="tx" x="'+X(i)+'" y="'+(Hh-9)+'" text-anchor="middle">'+(i<10?'0'+i:i)+':00</text>';}
  var poly=function(arr,Y,c,w){return '<polyline points="'+arr.map(function(v,i){return X(i)+','+Y(v);}).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linejoin="round" stroke-linecap="round"></polyline>';};
  // 매입가를 면으로 깔고 그 위에 판매가 → 둘 사이 간격이 곧 마진
  g+='<polygon points="'+X(0)+','+YL(0)+' '+M.buying.map(function(v,i){return X(i)+','+YL(v);}).join(' ')+' '+X(23)+','+YL(0)+'" fill="rgba(45,212,191,0.10)"></polygon>';
  g+=poly(M.selling,YL,'#fbbf24',2);
  g+=poly(M.buying,YL,'#2dd4bf',2);
  g+=poly(M.margin,YR,'#fb923c',2.2);
  var MT=M.totals;   // 주의: 전역 T()는 번역 함수라 이름을 겹치면 안 된다

   +'<div class="sub" style="margin:-8px 0 12px">'+M.date+' 실현 기준 · 전 국가 합계 · 마진은 <b style="color:#fb923c">오른쪽 축</b></div>'
   +'<div class="card"><div class="tiles" style="margin:0 0 16px">'
   +tile(T('mSelling'),wonS(MT.selling),F(MT.rn)+' '+T('unitNight'),'#fbbf24')
   +tile(T('mBuying'),wonS(MT.buying),T('mBuyingSub'),'#2dd4bf')
   +tile(T('mMargin'),wonS(MT.margin),T('mMarginSub',{v:MT.marginPct}),'#fb923c')
   +tile(T('mMarginPerRn'),wonS(MT.rn?Math.round(MT.margin/MT.rn):0),T('mRnSub'),'#cbd5e1')
   +'</div>'
   +'<div class="lg" style="flex-direction:row;gap:16px;padding:0 0 10px">'
   +'<div class="lgi"><span class="dot" style="background:#fbbf24"></span><span class="ln">TTV(판매가)</span></div>'
   +'<div class="lgi"><span class="dot" style="background:#2dd4bf"></span><span class="ln">매입가</span></div>'
   +'<div class="lgi"><span class="dot" style="background:#fb923c"></span><span class="ln">마진 (우축)</span></div></div>'

   +'<td style="text-align:right">'+(c.pending?'<span class="st warn">'+F(c.pending)+'</span>':'<span style="color:#4b5b76">0</span>')+'</td>'
   +'<td style="text-align:right">'+(c.cancelled?'<span class="st bad">'+F(c.cancelled)+'</span>':'<span style="color:#4b5b76">0</span>')+'</td>'
   +'<td style="text-align:right;color:'+(c.silentDays>=3?'#fca5a5':'#93a6c6')+';font-weight:'+(c.silentDays>=3?'700':'400')+'">'+c.silentDays+'일</td>'
   +'<td>'+spark(c.spark,110,26,'#34d399')+'</td></tr>').join('')
 +'</tbody></table></div></section>';

// ══ 8. 국가별 Top 20 도시 / 호텔 ══
function rankSection(id,title,data,nameHead){
  const keys=Object.keys(data||{}); if(!keys.length) return '';
  let h='<section><h2>'+title+'</h2>'
   +'<div class="sub" style="margin:-8px 0 12px">실현(취소 제외) 기준 · '+d.windowDays+'일 TTV 내림차순 · 점유율은 해당 국가 내 TTV 비중</div>'
   +'<div class="tabs">'+keys.map((k,i)=>'<button class="tab'+(i?'':' on')+'" data-g="'+id+'" data-k="'+esc(k)+'">'+(FLAG[k]||'🌏')+' '+esc(KO[k]||k)+'</button>').join('')+'</div>';
  keys.forEach((k,i)=>{
    h+='<div class="card scroll tabp" data-g="'+id+'" data-k="'+esc(k)+'"'+(i?' hidden':'')+'><table><thead><tr>'
     +'<th style="text-align:right">#</th><th>'+nameHead+'</th>'
     +'<th style="text-align:right">어제</th><th style="text-align:right">'+d.windowDays+'일</th>'
     +'<th style="text-align:right">TTV</th><th style="text-align:right">점유율</th>'
     +(d.hasMargin?'<th style="text-align:right">Profit</th><th style="text-align:right">마진율</th>':'')
     +'<th style="text-align:right">ADR</th></tr></thead><tbody>'
     +data[k].map(r=>'<tr><td style="text-align:right;color:#6b7ea0">'+r.rank+'</td>'
       +'<td style="font-weight:600">'+esc(r.name)+'</td>'
       +'<td style="text-align:right;font-weight:700">'+F(r.bkToday)+'</td>'
       +'<td style="text-align:right;color:#93a6c6">'+F(r.bk)+'</td>'
       +'<td style="text-align:right">'+wonS(r.ttv)+'</td>'
       +'<td style="text-align:right;color:#93c5fd;font-weight:700">'+r.share+'%</td>'
       +(d.hasMargin?'<td style="text-align:right">'+wonS(r.margin)+'</td>'
         +'<td style="text-align:right;color:'+(r.marginPct>0&&r.marginPct<5?'#fca5a5':'#cbd5e1')+';font-weight:700">'+r.marginPct+'%</td>':'')
       +'<td style="text-align:right;color:#93a6c6">'+wonS(r.adr)+'</td></tr>').join('')
     +'</tbody></table></div>';
  });
  return h+'</section>';
}
H+=TM('rank');
H+=rankSection('city',T('secTopCity'),d.topCities,T('thCity'));
H+=TM('rank');
H+=rankSection('hotel',T('secTopHotel'),d.topHotels,T('thHotel'));

H+='<div class="foot">데이터 소스: '+(d.source==='ellis-mcp'?'ELLIS MCP (get_hotel_bookings)':'processed booking-date 파일 (샘플/폴백)')+' · 부킹데이트 기준 · 금액은 '+(D.currency==='JPY'?'JPY(사내 기준 통화)':'KRW')+' 환산 · 취소건은 실현 RN/TTV/마진 집계에서 제외 · 테스트 예약(TEST 호텔/채널) 제외<br>'
 +'알럿은 최근 '+d.windowDays+'일 내 <b>생성된</b> 예약이 대상입니다 — 그 이전에 접수된 예약의 임박 체크인은 잡히지 않습니다 · '+T('confidential')+'</div>';
// ── 탭 조립 ──
// H에 심어둔 <!--@@key@@--> 마커로 잘라 탭별 패널로 재조립한다.
// 마커 앞부분(헤더 등)은 항상 보이는 고정 영역.
var TABDEF=[['overview',T('tabOverview')],['action',T('tabAction')],['trend',T('tabTrend')],['quality',T('tabQuality')],['mix',T('tabMix')],['rank',T('tabRank')]];
(function(){
  var parts=H.split(/<!--@@([a-z]+)@@-->/);
  var head=parts[0], bucket={};
  for(var i=1;i<parts.length;i+=2){ var k=parts[i]; bucket[k]=(bucket[k]||'')+(parts[i+1]||''); }
  var avail=TABDEF.filter(function(t){return (bucket[t[0]]||'').trim().length;});
  var bar='<div class="mtabs">'+avail.map(function(t,i){
    return '<button type="button" class="mtab'+(i?'':' on')+'" data-t="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>';
  var panels=avail.map(function(t,i){
    return '<div class="mpanel" data-t="'+t[0]+'"'+(i?' hidden':'')+'>'+bucket[t[0]]+'</div>';}).join('');
  document.getElementById('app').innerHTML=head+bar+panels;
  var saved=null; try{saved=localStorage.getItem('dt-tab');}catch(e){}
  function show(k){
    var any=false;
    document.querySelectorAll('.mtab').forEach(function(b){var on=b.dataset.t===k;b.classList.toggle('on',on);if(on)any=true;});
    if(!any) return false;
    document.querySelectorAll('.mpanel').forEach(function(x){x.hidden=(x.dataset.t!==k);});
    try{localStorage.setItem('dt-tab',k);}catch(e){}
    return true;
  }
  document.querySelectorAll('.mtab').forEach(function(b){
    b.addEventListener('click',function(){ show(b.dataset.t); window.scrollTo({top:0,behavior:'smooth'}); });
  });
  // 언어 전환 — 렌더가 최상위 1회 흐름이라 재렌더 대신 저장 후 리로드가 안전하다(자체완결 페이지라 즉시 뜬다).
  document.querySelectorAll('.lang').forEach(function(b){
    b.addEventListener('click',function(){ try{localStorage.setItem('dt-lang',b.dataset.l);}catch(e){} location.reload(); });
  });
  if(saved) show(saved);
})();

// 국가 탭 전환 (도시/호텔 랭킹). 그룹(data-g)별로 독립 동작.
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    var g=b.dataset.g,k=b.dataset.k;
    document.querySelectorAll('.tab[data-g="'+g+'"]').forEach(function(x){x.classList.toggle('on',x===b);});
    document.querySelectorAll('.tabp[data-g="'+g+'"]').forEach(function(x){x.hidden=(x.dataset.k!==k);});
  });
});

// ══ 알럿 상세 모달 ══
(function(){
  const ovl=document.createElement('div');
  ovl.className='ovl'; ovl.id='ovl';
  ovl.innerHTML='<div class="mdl" role="dialog" aria-modal="true" aria-labelledby="mdl-t"></div>';
  document.body.appendChild(ovl);
  const box=ovl.firstChild;
  let opener=null;

  function open(i){
    const a=d.alerts[i]; if(!a)return;
    const p=a.sev.toLowerCase(), n=(a.items||[]).length;
    box.className='mdl '+p;
    box.innerHTML='<div class="mdh"><span class="tag '+p+'">'+a.sev+'</span>'
      +'<span class="alt" id="mdl-t">'+esc(a.title)+'</span>'
      +'<span class="cnt" style="margin-left:14px">'+F(a.count)+'<span> '+esc(a.unit||'건')+'</span></span>'
      +'<button type="button" class="mdx" id="mdl-x" aria-label="닫기">✕</button></div>'
      +'<div class="mdb"><div class="ald">'+esc(a.detail)+'</div>'
      +'<div class="act" style="margin:0 20px 14px"><span class="own">담당 · '+esc(a.owner)+'</span><b>조치</b> — '+esc(a.action)+'</div>'
      +alertTable(a)+'</div>'
      +(a.count>n?'<div class="mdf">상위 '+F(n)+'건 표시 · 외 '+F(a.count-n)+'건은 ELLIS에서 확인</div>':'');
    ovl.classList.add('on');
    document.body.style.overflow='hidden';
    box.querySelector('#mdl-x').addEventListener('click',close);
    box.querySelector('#mdl-x').focus();
  }
  function close(){
    ovl.classList.remove('on');
    document.body.style.overflow='';
    if(opener){opener.focus();opener=null;}
  }
  document.querySelectorAll('.alcard').forEach(btn=>{
    btn.addEventListener('click',()=>{opener=btn;open(+btn.dataset.al);});
  });
  ovl.addEventListener('click',e=>{if(e.target===ovl)close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ovl.classList.contains('on'))close();});
})();

// draw 14-day stacked bars (실현 + 취소)
(function(){
  const el=document.getElementById('ch-days'); const W=el.clientWidth||1150,H2=300,m={t:22,r:14,b:38,l:44};
  const iw=W-m.l-m.r,ih=H2-m.t-m.b; const vals=d.days.map(x=>x.bookings); const max=Math.max(...vals,1)*1.12;
  const bw=iw/d.days.length; const y=v=>m.t+ih-(v/max)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H2+'">';
  for(let i=0;i<=4;i++){const gy=m.t+ih*(i/4),val=Math.round(max*(1-i/4));s+='<line class="gl" x1="'+m.l+'" y1="'+gy+'" x2="'+(W-m.r)+'" y2="'+gy+'"/><text class="tx" x="'+(m.l-7)+'" y="'+(gy+3)+'" text-anchor="end">'+F(val)+'</text>';}
  d.days.forEach((day,i)=>{const x0=m.l+bw*i+bw*0.16,w=bw*0.68,last=i===d.days.length-1;
    const done=day.bookings-day.cancelled;
    if(done>0)s+='<rect x="'+x0+'" y="'+y(day.bookings)+'" width="'+w+'" height="'+(y(day.cancelled)-y(day.bookings))+'" rx="3" fill="'+(last?'#f0851f':'#3b82f6')+'" opacity="'+(last?1:0.85)+'"/>';
    if(day.cancelled>0)s+='<rect x="'+x0+'" y="'+y(day.cancelled)+'" width="'+w+'" height="'+(m.t+ih-y(day.cancelled))+'" rx="3" fill="#64748b" opacity="0.75"/>';
    if(d.days.length<=8||i%2===0||last)s+='<text class="tx" x="'+(m.l+bw*i+bw/2)+'" y="'+(H2-22)+'" text-anchor="middle">'+day.date.slice(5)+'</text>';
    s+='<text class="tx" x="'+(m.l+bw*i+bw/2)+'" y="'+(H2-9)+'" text-anchor="middle" style="fill:#64748b">'+day.dow+'</text>';
    if(day.bookings>0)s+='<text class="tv" x="'+(m.l+bw*i+bw/2)+'" y="'+(y(day.bookings)-6)+'" text-anchor="middle" style="fill:'+(last?'#fbbf24':'#8ba0bd')+'">'+F(day.bookings)+'</text>';
  });
  s+='</svg>';el.innerHTML=s;
})();
</script>
