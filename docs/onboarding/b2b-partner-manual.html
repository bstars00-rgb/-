<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">

<title>OHMYHOTEL.Biz — B2B Partner Manual</title>
<script>(function(){try{var s=localStorage.getItem('b2b-theme');var m=s||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',m);}catch(e){}})();</script>
<style>
:root{
  --navy:#1E2761; --navy2:#141A45; --teal:#1C7293; --gold:#B5670F; --ink:#22262F; --muted:#6B7280;
  --line:#E3E7F0; --bg:#ffffff; --side:#F6F8FC; --code:#eef1f8; --accent:#1E2761;
  --ok:#1E8E4E; --okbg:#E4F4EA; --amber:#B5670F; --amberbg:#FBEBD6; --stop:#C0392B; --stopbg:#F7E2DF; --gray:#5B6472; --graybg:#EBEEF4;
}
:root[data-theme="dark"]{
  --ink:#E6E9F2; --muted:#98A2B8; --line:#2A3348; --bg:#0F1421; --side:#151B2B; --code:#1B2236; --accent:#9FB6EE; --teal:#78C0D6; --gold:#E5A65A;
  --ok:#5FCE93; --okbg:#12331F; --amber:#E5A65A; --amberbg:#3A2A12; --stop:#EA8B81; --stopbg:#3A1D1B; --gray:#AEB6C8; --graybg:#232B40;
}
:root[data-theme="dark"] .card{background:#151B2B}
:root[data-theme="dark"] .step{background:#151B2B}
:root[data-theme="dark"] figure img{filter:brightness(.92)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Malgun Gothic","Yu Gothic","Segoe UI",-apple-system,Roboto,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;font-size:16px}
code,.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
a{color:var(--teal)}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 22px;height:58px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.topbar .brand{font-weight:700;font-size:16px;letter-spacing:.2px}
.topbar .brand small{font-weight:400;color:#B9C6EA;font-size:12px;margin-left:8px}
.spacer{flex:1}
.langsw{display:flex;gap:2px;background:#141A45;border:1px solid #3A4488;border-radius:9px;padding:3px}
.langsw button{font-size:13px;line-height:1;background:transparent;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;color:#C7D3F0;font-weight:600}
.langsw button.on{background:#3A4488;color:#fff}
.tbtn{font-size:14px;line-height:1;background:transparent;border:1px solid #3A4488;border-radius:8px;padding:7px 11px;cursor:pointer;color:#C7D3F0}
.tbtn:hover{background:#2A3488}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr)}
aside{position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:20px 14px}
aside .navttl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 8px 10px}
aside a{display:block;color:var(--ink);text-decoration:none;font-size:14px;padding:7px 11px;border-radius:7px}
aside a:hover{background:#e9eef8}
aside a.on{background:#e5e9f6;color:var(--accent);font-weight:700}
:root[data-theme="dark"] aside a:hover{background:#1c243a}
:root[data-theme="dark"] aside a.on{background:#232b40}
aside a .sn{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:var(--teal);color:#fff;border-radius:6px;font-size:12px;font-weight:700;margin-right:8px}
main{padding:34px 56px 90px;min-width:0}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:30px 34px;margin-bottom:8px}
.hero h1{font-size:29px;line-height:1.25;margin:.1em 0;font-weight:800}
.hero .lead{color:#C7D3F0;font-size:15.5px;margin:6px 0 0}
.hero .url{display:inline-block;margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:7px 13px;font:600 13.5px/1 ui-monospace,Consolas,monospace;color:#fff;text-decoration:none}
section{scroll-margin-top:70px;padding-top:34px}
section h2{font-size:22px;color:var(--accent);font-weight:800;margin:.3em 0 .5em;padding-bottom:.28em;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:10px}
section h2 .ic{font-size:22px}
section h2 .ph{font:700 12px/1 ui-monospace,Consolas,monospace;background:var(--navy);color:#fff;padding:5px 9px;border-radius:6px;margin-left:auto}
:root[data-theme="dark"] section h2 .ph{background:#2A3488}
section h3{font-size:16.5px;color:var(--ink);font-weight:700;margin:1.4em 0 .3em;display:flex;align-items:center;gap:8px}
section h3 .num{background:var(--gold);color:#fff;font:700 12px/1 ui-monospace,Consolas,monospace;padding:4px 7px;border-radius:6px}
p{margin:.5em 0}
ul,ol{margin:.5em 0;padding-left:1.25em}
li{margin:.28em 0}
figure{margin:16px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--side)}
figure img{display:block;width:100%;height:auto;cursor:zoom-in}
figure figcaption{font-size:12.5px;color:var(--muted);padding:9px 14px;border-top:1px solid var(--line);background:var(--bg)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;margin:16px 0}
.step{border:1px solid var(--line);border-radius:11px;padding:14px 15px;background:#fff}
.step .n{font:800 12px/1 ui-monospace,Consolas,monospace;color:#fff;background:var(--teal);width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:9px}
.step h4{margin:0 0 4px;font-size:14.5px;color:var(--accent)}
.step p{margin:0;font-size:13px;color:var(--muted);line-height:1.55}
.cal{border-radius:9px;padding:12px 15px;margin:15px 0;border:1px solid;font-size:14px}
.cal .ct{font-weight:700;display:block;margin-bottom:2px}
.cal.tip{background:var(--okbg);border-color:#B7E0C6}.cal.tip .ct{color:var(--ok)}
.cal.warn{background:var(--amberbg);border-color:#F0CE9E}.cal.warn .ct{color:var(--amber)}
.cal.info{background:#E7EEFA;border-color:#C2D2F0}.cal.info .ct{color:var(--teal)}
:root[data-theme="dark"] .cal.info{background:#16233A;border-color:#2A3D5E}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:700;font-size:12.5px}
tr:nth-child(even) td{background:var(--side)}
td .k{font:600 12.5px/1.4 ui-monospace,Consolas,monospace;color:var(--accent)}
.contact{margin-top:40px;border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:14px}
.contact a{font-weight:700}
.pdfbtn{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;text-decoration:none;font-size:13.5px;font-weight:700;padding:9px 15px;border-radius:9px;margin-top:6px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{display:none}main{padding:22px 18px 70px}}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(9,12,22,.9);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:24px}
#lb img{max-width:96vw;max-height:92vh;border-radius:8px;box-shadow:0 12px 50px rgba(0,0,0,.6)}
</style>
</head>

/* ---------- render ---------- */
var lang=(localStorage.getItem('b2b-lang'))||'ko';
function tx(o){return o&&o[lang]!=null?o[lang]:(o&&o.en)||'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderTOC(){
  var h='';
  SECTIONS.forEach(function(s,i){
    h+='<a href="#'+s.id+'" data-id="'+s.id+'"><span class="sn">'+(i+1)+'</span>'+esc(tx(s.title))+'</a>';
  });
  document.getElementById('toc').innerHTML=h;
}
function block(b){
  if(b.t==='p') return '<p>'+esc(tx(b.text))+'</p>';
  if(b.t==='h3') return '<h3><span class="num">'+b.num+'</span>'+esc(tx(b.title))+'</h3>';
  if(b.t==='img') return '<figure><img loading="lazy" src="'+IMG+b.src+'" alt="'+esc(tx(b.cap))+'"><figcaption>'+esc(tx(b.cap))+'</figcaption></figure>';
  if(b.t==='cal') return '<div class="cal '+b.kind+'"><span class="ct">'+esc(tx(b.ttl))+'</span>'+esc(tx(b.body))+'</div>';
  if(b.t==='steps'){
    var h='<div class="steps">';
    b.items.forEach(function(it,i){h+='<div class="step"><span class="n">'+(i+1)+'</span><h4>'+esc(tx(it.h))+'</h4><p>'+esc(tx(it.d))+'</p></div>';});
    return h+'</div>';
  }
  if(b.t==='tbl'){
    var h='<table><thead><tr>';
    b.head.forEach(function(c){h+='<th>'+esc(tx(c))+'</th>';});
    h+='</tr></thead><tbody>';
    b.rows.forEach(function(r){
      h+='<tr><td><span class="k">'+esc(r[0])+'</span></td><td>'+esc(tx(r[1]))+'</td></tr>';
    });
    return h+'</tbody></table>';
  }
  return '';
}
function renderMain(){
  var h='<div class="hero"><h1>'+esc(tx(META.heroTitle))+'</h1><p class="lead">'+esc(tx(META.heroLead))+'</p>'
   +'<a class="url" href="https://ohmyhotel.biz/login" target="_blank" rel="noopener">www.ohmyhotel.biz</a></div>';
  SECTIONS.forEach(function(s,i){
    h+='<section id="'+s.id+'"><h2><span class="ic">'+s.icon+'</span>'+(i+1)+'. '+esc(tx(s.title))+'<span class="ph">'+tx(CT_STEP)+' '+(i+1)+'</span></h2>';
    s.blocks.forEach(function(b){h+=block(b);});
    h+='</section>';
  });
  h+='<div class="contact"><p>'+esc(tx(META.contact))+'</p><p>✉️ <a href="mailto:sales@ohmyhotel.com">sales@ohmyhotel.com</a></p>'
   +'<a class="pdfbtn" href="B2B_Partner_Manual_EN.pptx" download>'+esc(tx(META.pdf))+'</a></div>';
  document.getElementById('main').innerHTML=h;
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelector('[data-sub]').textContent=tx(META.sub);
  document.querySelector('[data-toc]').textContent=tx(META.toc);
  [].forEach.call(document.querySelectorAll('#langsw button'),function(b){b.classList.toggle('on',b.dataset.l===lang);});
  renderTOC(); renderMain(); wireImgs(); spy();
}
function wireImgs(){
  [].forEach.call(document.querySelectorAll('figure img'),function(im){
    im.onclick=function(){var lb=document.getElementById('lb');document.getElementById('lbimg').src=im.src;lb.style.display='flex';};
  });
}
document.getElementById('lb').onclick=function(){this.style.display='none';};
document.getElementById('langsw').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return; lang=b.dataset.l; localStorage.setItem('b2b-lang',lang); applyLang();
});
document.getElementById('themeBtn').onclick=function(){
  var d=document.documentElement,m=d.getAttribute('data-theme')==='dark'?'light':'dark';
  d.setAttribute('data-theme',m);localStorage.setItem('b2b-theme',m);
};
/* scroll spy */
var secEls=[];
function spy(){
  secEls=[].slice.call(document.querySelectorAll('main section'));
}
window.addEventListener('scroll',function(){
  var y=window.scrollY+120,cur=null;
  secEls.forEach(function(s){if(s.offsetTop<=y)cur=s.id;});
  [].forEach.call(document.querySelectorAll('#toc a'),function(a){a.classList.toggle('on',a.dataset.id===cur);});
},{passive:true});
applyLang();
</script>
